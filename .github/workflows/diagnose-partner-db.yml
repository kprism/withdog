name: Diagnose partner application DB

on:
  push:
    branches: [intro-homepage]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/819578664210/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@thepetkorea.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Inspect production partner DB
        run: |
          gcloud compute ssh thepetkorea-main-vm \
            --project=thepetkorea \
            --zone=asia-northeast3-a \
            --quiet \
            --command="cd /home/mstclma00/withdog/backend && sudo -u mstclma00 .venv/bin/python manage.py shell -c \"from django.db.models import Q; from partners.models import Partner; allq=Partner.objects.all(); direct=allq.filter(source='public_partner_application'); legacy=allq.filter(~Q(representative_name=''),~Q(contact_email=''),is_affiliated=True); union=allq.filter(Q(source='public_partner_application') | (~Q(representative_name='') & ~Q(contact_email='') & Q(is_affiliated=True))).distinct(); print('PARTNER_DB_TOTAL=',allq.count()); print('DIRECT_SOURCE_COUNT=',direct.count()); print('LEGACY_APPLICATION_CANDIDATES=',legacy.count()); print('APPLICATION_UNION_COUNT=',union.count()); print('DIRECT_ROWS=',list(direct.values('id','name','representative_name','contact_email','application_status','is_active','source','created_at'))); print('LEGACY_ROWS=',list(legacy.values('id','name','representative_name','contact_email','application_status','is_active','source','created_at')[:50]))\""
