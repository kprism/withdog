              if '경상남도 반려견 협회 회원가입 및 이용 문의 안내' not in notice_titles:
                  raise SystemExit('Membership contact notice missing from homepage notice feed')

          with urllib.request.urlopen('https://thepetkorea.co.kr/', timeout=20) as response:
              home_html=response.read().decode('utf-8','replace')
