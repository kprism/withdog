                  if 'href="/partners.html">후원업체</a>' in html:
                      raise SystemExit(f'Legacy sponsor menu label still present: {url}')
                  if '🐶' in html.split('</header>', 1)[0]:
                      raise SystemExit(f'Legacy header dog fallback still present: {url}')

          with urllib.request.urlopen('https://thepetkorea.co.kr/join/partner', timeout=20) as response:
              direct_join_html=response.read().decode('utf-8','replace')
              if '<base href="/">' not in direct_join_html:
                  raise SystemExit('Partner join deep link base href missing')
              if 'site-header--intro' not in direct_join_html:
                  raise SystemExit('Partner join deep link did not render intro header')
              if 'app.js?v=20261109-partner-register-v1' not in direct_join_html:
                  raise SystemExit('Partner join deep link app asset version missing')

          with urllib.request.urlopen('https://thepetkorea.co.kr/api/content/?kind=popup', timeout=20) as response:
              popup_payload=json.loads(response.read().decode('utf-8','replace'))
              contact_popups=[
                  row for row in popup_payload.get('results',[])
                  if row.get('label') == 'contact-notice'
              ]
              if not contact_popups:
                  raise SystemExit('Membership contact popup missing in production')
              contact_popup=contact_popups[0]
              if '010-3556-8603' not in contact_popup.get('body','') or '010-6622-3454' not in contact_popup.get('body',''):
                  raise SystemExit('Membership contact phone numbers missing in production popup')
              if not str(contact_popup.get('link','')).startswith('/board/'):
                  raise SystemExit('Membership contact popup notice link missing')

          with urllib.request.urlopen('https://thepetkorea.co.kr/api/intro-news/', timeout=20) as response:
              intro_news_payload=json.loads(response.read().decode('utf-8','replace'))
              notice_titles={
                  row.get('title')
                  for row in intro_news_payload.get('notice',[])
