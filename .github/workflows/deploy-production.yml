name: Deploy production

on:
  push:
    branches: [intro-homepage]
  workflow_dispatch:

concurrency:
  group: thepetkorea-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Django checks
        working-directory: backend
        run: python manage.py check
      - name: Collect and verify static assets
        working-directory: backend
        run: |
          python manage.py collectstatic --noinput
          test -s staticfiles/member_dog_stamp.webp

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/819578664210/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@thepetkorea.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare production repository trust
        run: |
          gcloud compute ssh thepetkorea-main-vm \
            --project=thepetkorea \
            --zone=asia-northeast3-a \
            --quiet \
            --command="sudo git config --global --add safe.directory /home/mstclma00/withdog"

      - name: Deploy exact tested commit to GCE
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          gcloud compute ssh thepetkorea-main-vm \
            --project=thepetkorea \
            --zone=asia-northeast3-a \
            --quiet \
            --command="sudo /usr/local/sbin/deploy-thepetkorea ${DEPLOY_SHA}"

      - name: Collect static assets on production
        run: |
          gcloud compute ssh thepetkorea-main-vm \
            --project=thepetkorea \
            --zone=asia-northeast3-a \
            --quiet \
            --command="cd /home/mstclma00/withdog/backend && sudo -u mstclma00 .venv/bin/python manage.py collectstatic --noinput && test -s staticfiles/member_dog_stamp.webp && sudo systemctl restart thepetkorea"

      - name: Verify public endpoints and membership image
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          checks = [
              ('https://thepetkorea.co.kr/', False),
              ('https://thepetkorea.co.kr/mypage/', False),
              ('https://thepetkorea.co.kr/static/member_dog_stamp.webp', True),
          ]
          for url, must_be_200 in checks:
              req = urllib.request.Request(url, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      print(url, response.status, response.headers.get('Content-Type'))
                      if must_be_200 and response.status != 200:
                          raise SystemExit(1)
                      if response.status >= 500:
                          raise SystemExit(1)
              except urllib.error.HTTPError as exc:
                  print(url, exc.code)
                  if must_be_200 or exc.code >= 500:
                      raise
          PY
