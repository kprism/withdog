      - name: Verify dedicated favicon delete action
        working-directory: backend
        run: |
          python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from django.core.files.uploadedfile import SimpleUploadedFile
          from django.test import Client
          from partners.models import SiteSetting

          User=get_user_model()
          admin=User.objects.create_superuser(
              username='ci-favicon-admin',
              email='ci-favicon@example.com',
              password='ci-test-password',
          )

          setting=SiteSetting.get_solo()
          original_name=setting.favicon.name if setting.favicon else ''
          setting.favicon=SimpleUploadedFile(
              'ci-favicon.png',
              b'fake-favicon',
              content_type='image/png',
          )
          setting.save()
          test_name=setting.favicon.name

          client=Client()

          first_favicon=client.get('/favicon.ico')
          assert first_favicon.status_code == 200
          assert first_favicon['Cache-Control'] == 'public, no-cache, max-age=0, must-revalidate'
          assert first_favicon['Pragma'] == 'no-cache'
          assert first_favicon['Expires'] == '0'
          first_bytes=b''.join(first_favicon.streaming_content)
          assert first_bytes == b'fake-favicon'

          # Replacing the stored favicon must immediately change /favicon.ico
          # without waiting for the previous 24-hour cache.
          setting.favicon=SimpleUploadedFile(
              'ci-favicon-new.png',
              b'new-favicon',
              content_type='image/png',
          )
          setting.save()
          latest_favicon=client.get('/favicon.ico')
          assert latest_favicon.status_code == 200
          latest_bytes=b''.join(latest_favicon.streaming_content)
          assert latest_bytes == b'new-favicon'
          assert latest_bytes != first_bytes

          client.force_login(admin)

          page=client.get('/dashboard/site-settings/')
          assert page.status_code == 200
          html=page.content.decode('utf-8','replace')
          assert 'name="action" value="delete_favicon"' in html
          assert '파비콘 삭제' in html
          assert 'name="delete_favicon"' not in html

          response=client.post(
              '/dashboard/site-settings/',
              {'action':'delete_favicon'},
              follow=False,
          )
          assert response.status_code == 302

          setting.refresh_from_db()
          assert not setting.favicon

          favicon_response=client.get('/favicon.ico')
          assert favicon_response.status_code == 404

          if original_name:
              setting.favicon.name=original_name
              setting.save(update_fields=['favicon','updated_at'])

          admin.delete()
          print('FAVICON_DELETE_ACTION_OK', test_name)
          PY
