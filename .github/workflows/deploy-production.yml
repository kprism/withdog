name: Deploy production

on:
  push:
    branches: [intro-homepage]
  workflow_dispatch:

concurrency:
  group: thepetkorea-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Django checks
        working-directory: backend
        run: python manage.py check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/819578664210/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@thepetkorea.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy exact tested commit to GCE
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          gcloud compute ssh thepetkorea-main-vm \
            --project=thepetkorea \
            --zone=asia-northeast3-a \
            --quiet \
            --command="sudo /usr/local/sbin/deploy-thepetkorea ${DEPLOY_SHA}"

      - name: Verify public endpoints
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          for url in [
              'https://thepetkorea.co.kr/',
              'https://thepetkorea.co.kr/mypage/',
          ]:
              req = urllib.request.Request(url, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      print(url, response.status)
                      if response.status >= 500:
                          raise SystemExit(1)
              except urllib.error.HTTPError as exc:
                  print(url, exc.code)
                  if exc.code >= 500:
                      raise
          PY
