name: Deploy production

on:
  push:
    branches: [intro-homepage]
  workflow_dispatch:

concurrency:
  group: thepetkorea-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Django checks
        working-directory: backend
        run: python manage.py check
      - name: Verify migration state
        working-directory: backend
        run: python manage.py makemigrations partners --check --dry-run --verbosity 3
      - name: Verify member deletion ledger preservation
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from partners.models import MemberProfile, PaymentRecord
          User=get_user_model()
          u=User.objects.create_user(username='ci-delete@example.com',email='ci-delete@example.com',password='test12345')
          p=MemberProfile.objects.create(user=u,name='삭제테스트',phone='010-0000-0000',membership_status='withdrawn')
          r=PaymentRecord.objects.create(
              user=u,
              member_name=p.name,
              member_email=u.email,
              member_region='경남',
              member_address='테스트 주소',
              environment='test',
              order_id='CI_MEMBER_DELETE_LEDGER',
              amount=30000,
              status='DONE',
          )
          u.delete()
          r.refresh_from_db()
          assert r.user_id is None
          assert r.member_name == '삭제테스트'
          assert r.member_email == 'ci-delete@example.com'
          r.delete()
          print('MEMBER_DELETE_LEDGER_PRESERVED')
          PY
      - name: Verify advertisement slot rendering
        working-directory: backend
        run: |
          python manage.py shell <<'PY'
          from django.core.files.uploadedfile import SimpleUploadedFile
          from django.test import Client
          from django.utils import timezone
          from partners.models import Advertisement
          today=timezone.localdate()
          ad=Advertisement.objects.create(
              advertiser_name='CI 광고주',
              representative_name='테스트',
              business_number='000-00-00000',
              title='CI 우측 광고',
              target_page='home',
              placement='right',
              start_date=today,
              end_date=today,
              fee=10000,
              media_type='image',
              media_file=SimpleUploadedFile('ci-ad.png',b'fake-image',content_type='image/png'),
              is_active=True,
          )
          response=Client().get('/')
          html=response.content.decode('utf-8','replace')
          assert response.status_code == 200
          assert 'id="publicAdRail"' in html
          assert 'CI 우측 광고' in html
          assert 'public-ad-layout' in open('../assets/css/style.css',encoding='utf-8').read()
          ad.media_file.delete(save=False)
          ad.delete()

          # Public menu/content pages reserve the desktop right ad rail
          # even when there is currently no active advertisement.
          about=Client().get('/about.html')
          about_html=about.content.decode('utf-8','replace')
          assert about.status_code == 200
          assert 'public-ad-rail--empty' in about_html
          assert 'data-page="about"' in about_html

          # Homepage stays full-width unless an actual homepage ad exists.
          home=Client().get('/')
          home_html=home.content.decode('utf-8','replace')
          assert 'public-ad-rail--empty' not in home_html
          print('ADVERTISEMENT_SLOT_RENDERED')
          print('RESERVED_RIGHT_RAIL_RENDERED')
          PY
      - name: Verify partner menu, city order, discount, and Kakao loader
        working-directory: backend
        run: |
          python manage.py shell <<'PY'
          from django.test import Client
          from partners.models import Partner, PartnerCategory, SiteSetting

          category,_=PartnerCategory.objects.get_or_create(
              code='ci-partner-order',
              defaults={'name':'CI 제휴업체','sort_order':999},
          )

          samples=[
              ('거제시 업체','거제시',7),
              ('밀양시 업체','밀양시',8),
              ('양산시 업체','양산시',9),
              ('진주시 업체','진주시',10),
              ('김해시 업체','김해시',11),
              ('창원시 업체','창원시',12),
              ('합천군 업체','합천군',13),
          ]

          created=[]
          for index,(name,city,discount) in enumerate(samples):
              partner=Partner.objects.create(
                  category=category,
                  name=name,
                  address=f'CI 테스트 주소 {index}',
                  city=city,
                  discount_percent=discount,
                  is_active=True,
              )
              created.append(partner)

          setting=SiteSetting.get_solo()
          original_key=setting.kakao_javascript_key
          setting.kakao_javascript_key='ci-kakao-js-key'
          setting.save(update_fields=['kakao_javascript_key','updated_at'])

          client=Client()
          settings_response=client.get('/api/site-settings/')
          assert settings_response.status_code == 200
          assert settings_response.json()['kakao_javascript_key'] == 'ci-kakao-js-key'

          response=client.get('/api/partners/public-map/')
          assert response.status_code == 200
          data=response.json()

          cities=[x for x in data['cities'] if x in {
              '창원시','김해시','진주시','양산시','밀양시','거제시','합천군'
          }]
          assert cities == [
              '창원시','김해시','진주시','양산시','밀양시','거제시','합천군'
          ], cities

          rows={
              row['name']:row
              for row in data['partners']
              if row['name'].startswith(('창원시','김해시','진주시','양산시','밀양시','거제시','합천군'))
          }
          assert rows['창원시 업체']['discount_percent'] == 12
          assert rows['거제시 업체']['discount_percent'] == 7

          header=open('partners/templates/website/includes/public_header.html',encoding='utf-8').read()
          partner_form=open('partners/templates/dashboard/partner_form.html',encoding='utf-8').read()
          partner_page=open('../partners.html',encoding='utf-8').read()
          partner_js=open('../assets/js/partners.js',encoding='utf-8').read()
          partner_css=open('../assets/css/partners.css',encoding='utf-8').read()

          assert '>제휴업체</a>' in header
          assert '>후원업체</a>' not in header
          assert 'name="discount_percent"' in partner_form
          assert '회원 할인율 (%)' in partner_form
          assert '//dapi.kakao.com/v2/maps/sdk.js?appkey=' not in partner_page
          assert "fetch(\n            '/api/site-settings/" in partner_js
          assert 'kakao_javascript_key' in partner_js
          assert 'autoload=false' in partner_js
          assert 'partner-discount' in partner_js
          assert '.partner-discount{' in partner_css

          setting.kakao_javascript_key=original_key
          setting.save(update_fields=['kakao_javascript_key','updated_at'])
          Partner.objects.filter(pk__in=[p.pk for p in created]).delete()
          category.delete()

          print('PARTNER_MENU_CITY_DISCOUNT_KAKAO_OK')
          PY
      - name: Verify homepage notice and pet news feed
        working-directory: backend
        run: |
          python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from django.core.files.uploadedfile import SimpleUploadedFile
          from django.test import Client
          from django.utils import timezone
          from partners.models import BoardAttachment, BoardCategory, BoardComment, BoardPost

          event = BoardCategory.objects.get(board_type='community', slug='event')
          assert event.name == '행사'
          assert event.is_active is True

          notice_category, notice_created = BoardCategory.objects.get_or_create(
              board_type='notice',
              slug='notice',
              defaults={'name':'공지사항','sort_order':0,'is_active':True},
          )

          User=get_user_model()
          user=User.objects.create(username='ci-intro-news-user')

          pet=BoardPost.objects.create(
              board_type='community',
              category=event,
              author=user,
              title='CI 펫 소식 테스트',
              body='자유게시판 글이 메인 펫 소식에 노출되는지 확인',
              is_published=True,
              is_hidden=False,
              published_at=timezone.now(),
          )
          pet_image=BoardAttachment.objects.create(
              post=pet,
              file=SimpleUploadedFile('ci-pet.jpg', b'fake-image', content_type='image/jpeg'),
              original_name='ci-pet.jpg',
              is_image=True,
              sort_order=0,
          )
          BoardComment.objects.create(post=pet, author=user, body='댓글 테스트')

          notice=BoardPost.objects.create(
              board_type='notice',
              category=notice_category,
              author=user,
              title='CI 공지 테스트',
              body='공지 메인 노출 확인',
              is_published=True,
              is_hidden=False,
              published_at=timezone.now(),
          )
          notice_image=BoardAttachment.objects.create(
              post=notice,
              file=SimpleUploadedFile('ci-notice.jpg', b'fake-image', content_type='image/jpeg'),
              original_name='ci-notice.jpg',
              is_image=True,
              sort_order=0,
          )
          BoardComment.objects.create(post=notice, author=user, body='공지 댓글 테스트')

          response=Client().get('/api/intro-news/')
          assert response.status_code == 200
          data=response.json()
          pet_row=next(x for x in data['pet_news'] if x['id'] == pet.pk)
          notice_row=next(x for x in data['notice'] if x['id'] == notice.pk)

          assert pet_row['source'] == 'community'
          assert pet_row['url'] == f'/community/{pet.pk}/'
          assert pet_row['has_image'] is True
          assert pet_row['image_url'] == pet_image.file.url
          assert pet_row['comment_count'] == 1
          assert notice_row['source'] == 'notice'
          assert notice_row['url'] == f'/board/{notice.pk}/'
          assert notice_row['has_image'] is True
          assert notice_row['image_url'] == notice_image.file.url
          assert notice_row['comment_count'] == 1

          community_detail=Client().get(f'/community/{pet.pk}/')
          community_html=community_detail.content.decode('utf-8','replace')
          assert community_detail.status_code == 200
          assert 'community-inline-images' in community_html
          assert pet_image.file.url in community_html

          cms_js=open('../assets/js/cms.js',encoding='utf-8').read()
          style_css=open('../assets/css/style.css',encoding='utf-8').read()
          assert 'intro-news-thumb' in cms_js
          assert 'post.image_url' in cms_js
          assert '.intro-news-thumb{' in style_css

          pet_image.file.delete(save=False)
          notice_image.file.delete(save=False)
          pet.delete()
          notice.delete()
          user.delete()
          if notice_created:
              notice_category.delete()

          print('INTRO_NOTICE_PET_NEWS_OK')
          PY
      - name: Verify Dog Life linked media
        working-directory: backend
        run: |
          python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from django.test import Client
          from django.utils import timezone
          from partners.models import BoardAttachment, BoardCategory, BoardPost
          from partners.website_views import _doglife_external_link_info

          yt=_doglife_external_link_info('https://youtu.be/dQw4w9WgXcQ')
          assert yt['provider']=='youtube'
          assert yt['media_id']=='dQw4w9WgXcQ'
          direct=_doglife_external_link_info('https://cdn.example.com/sample.mp4')
          assert direct['provider']=='video'

          User=get_user_model()
          user=User.objects.create_user(username='ci-doglife-link@example.com',email='ci-doglife-link@example.com',password='test12345')
          category,_=BoardCategory.objects.get_or_create(
              board_type='doglife',
              slug='ci-linked-media',
              defaults={'name':'CI 링크영상','sort_order':999,'is_active':True},
          )
          post=BoardPost.objects.create(
              board_type='doglife',
              category=category,
              author=user,
              title='CI 링크 영상 테스트',
              body='링크 영상 테스트',
              display_type='video_horizontal',
              is_published=True,
              is_hidden=False,
              published_at=timezone.now(),
          )
          media=BoardAttachment.objects.create(
              post=post,
              external_url='https://youtu.be/dQw4w9WgXcQ',
              external_provider='youtube',
              external_media_id='dQw4w9WgXcQ',
              original_name='https://youtu.be/dQw4w9WgXcQ',
              sort_order=0,
          )
          assert media.external_embed_url=='https://www.youtube.com/embed/dQw4w9WgXcQ'
          assert 'i.ytimg.com/vi/dQw4w9WgXcQ' in media.external_thumbnail_url

          client=Client()
          detail=client.get(f'/doglife/{post.pk}/')
          detail_html=detail.content.decode('utf-8','replace')
          assert detail.status_code==200
          assert 'https://www.youtube.com/embed/dQw4w9WgXcQ' in detail_html

          listing=client.get('/doglife/')
          listing_html=listing.content.decode('utf-8','replace')
          assert listing.status_code==200
          assert 'i.ytimg.com/vi/dQw4w9WgXcQ' in listing_html

          form_html=open('partners/templates/website/doglife_form.html',encoding='utf-8').read()
          assert '🔗 링크 삽입' in form_html
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in form_html
          assert form_html.count('class="upload-btn"') >= 4

          post.delete()
          user.delete()
          category.delete()
          print('DOG_LIFE_LINKED_MEDIA_OK')
          PY
