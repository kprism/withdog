{% extends 'dashboard/base.html' %}{% block title %}관리자 계정{% endblock %}{% block header %}관리자 계정 관리{% endblock %}{% block content %}<div class="hero"><div><div class="eyebrow">ADMIN EDITOR</div><h2>{% if obj %}관리자 수정{% else %}관리자 추가{% endif %}</h2></div></div><form class="panel" method="post">{% csrf_token %}<div class="form-grid"><div class="field"><label>아이디 *</label><input name="username" required value="{{ obj.username|default:'' }}"></div><div class="field"><label>이름</label><input name="name" value="{{ obj.first_name|default:'' }}"></div><div class="field"><label>이메일</label><input type="email" name="email" value="{{ obj.email|default:'' }}"></div><div class="field"><label>비밀번호 {% if obj %}(변경할 때만 입력){% else %}*{% endif %}</label><input type="password" name="password" {% if not obj %}required{% endif %}></div></div><div style="margin:20px 0;display:flex;gap:22px"><label><input type="checkbox" name="is_active" {% if not obj or obj.is_active %}checked{% endif %}> 계정 활성</label><label><input type="checkbox" name="is_superuser" {% if obj.is_superuser %}checked{% endif %}> 최고관리자 권한</label></div><button class="btn">저장</button> <a class="btn ghost" href="{% url 'operator_dashboard:manage_section' 'admins' %}">취소</a></form>{% endblock %}
