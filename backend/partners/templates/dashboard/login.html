<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 로그인 | 경상남도 반려견협회</title><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:#f4f5f3;color:#151515}.wrap{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr}.visual{background:linear-gradient(145deg,#071c10,#102c1a);color:white;padding:70px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}.visual:after{content:'🐾';position:absolute;right:-60px;bottom:-120px;font-size:420px;opacity:.045;transform:rotate(-15deg)}.brand{display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;border-radius:50%;background:#fff3e7;display:grid;place-items:center;font-size:34px}.brand b{font-size:21px}.brand small{display:block;color:#91a89a;margin-top:5px}.copy{position:relative;z-index:2;max-width:600px}.eyebrow{color:#efc755;font-size:12px;letter-spacing:4px;font-weight:900}.copy h1{font-size:50px;line-height:1.14;margin:18px 0}.copy p{color:#b8c8be;line-height:1.8}.right{display:grid;place-items:center;padding:36px}.box{width:min(460px,100%);background:#fff;border-radius:22px;padding:44px;box-shadow:0 22px 70px rgba(0,0,0,.09)}.box h2{font-size:29px;margin:7px 0}.sub{color:#888;font-size:14px;margin-bottom:30px}.field{margin:17px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:8px}.field input{width:100%;height:50px;border:1px solid #ddd;border-radius:10px;padding:0 14px;font-size:16px;outline:none}.field input:focus{border-color:#c91f26;box-shadow:0 0 0 3px rgba(201,31,38,.08)}button{width:100%;height:52px;border:0;border-radius:10px;background:#c91f26;color:white;font-size:16px;font-weight:900;cursor:pointer;margin-top:8px;transition:.18s}button:hover{background:#a9161d;transform:translateY(-1px)}.error{background:#fff0f0;color:#a71920;padding:12px 14px;border-radius:9px;font-size:13px;margin:14px 0}.back{display:block;text-align:center;color:#777;font-size:13px;margin-top:20px}@media(max-width:800px){.wrap{grid-template-columns:1fr}.visual{min-height:300px;padding:38px}.copy h1{font-size:35px}.right{padding:24px}.box{padding:30px}}</style></head><body><div class="wrap"><section class="visual"><div class="brand"><span class="logo">🐶</span><span><b>경상남도 반려견 협회</b><small>Gyeongnam Pet Dog Association</small></span></div><div class="copy"><div class="eyebrow">ADMINISTRATION</div><h1>협회 운영을<br>한 곳에서 관리합니다</h1><p>회원, 반려견, 관련업체, 게시판과 홈페이지 콘텐츠를 관리하는 협회 전용 운영 시스템입니다.</p></div></section><section class="right"><div class="box"><div class="eyebrow">ADMIN LOGIN</div><h2>관리자 로그인</h2><div class="sub">승인된 협회 관리자 계정으로 로그인해 주세요.</div>{% if form.errors %}<div class="error">아이디 또는 비밀번호를 확인해 주세요.</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next|default:'/dashboard/' }}"><div class="field"><label for="id_username">관리자 아이디</label><input type="text" name="username" autofocus required id="id_username" autocomplete="username"></div><div class="field"><label for="id_password">비밀번호</label><input type="password" name="password" required id="id_password" autocomplete="current-password"></div><button type="submit">관리자 대시보드 로그인</button></form><a class="back" href="/">← 협회 홈페이지로 돌아가기</a></div></section></div></body></html>
