{% extends "dashboard/base.html" %}{% block title %}결제 설정{% endblock %}{% block header %}결제 및 정산 · 결제{% endblock %}{% block content %}<div class="hero"><div><div class="eyebrow">TOSS PAYMENTS</div><h2>결제 설정</h2><p class="muted">시크릿키는 서버에만 저장되며 화면과 브라우저로 전송하지 않습니다.</p></div></div><form method="post" class="panel">{% csrf_token %}<div class="form-grid"><div class="field"><label>테스트 클라이언트키</label><input name="test_client_key" value="{{ setting.test_client_key }}" placeholder="test_gck_... 또는 test_ck_..."></div><div class="field"><label>테스트 시크릿키</label><input type="password" name="test_secret_key" placeholder="{% if setting.test_secret_key %}저장됨 · 변경할 때만 입력{% else %}test_gsk_... 또는 test_sk_...{% endif %}"></div><div class="field"><label>라이브 클라이언트키</label><input name="live_client_key" value="{{ setting.live_client_key }}" placeholder="live_gck_... 또는 live_ck_..."></div><div class="field"><label>라이브 시크릿키</label><input type="password" name="live_secret_key" placeholder="{% if setting.live_secret_key %}저장됨 · 변경할 때만 입력{% else %}live_gsk_... 또는 live_sk_...{% endif %}"></div><div class="field"><label>정회원 연회비</label><input type="number" name="annual_fee" value="{{ setting.annual_fee }}"></div><div class="field"><label>결제 환경</label><label style="font-weight:500"><input type="checkbox" name="live_enabled" {% if setting.live_enabled %}checked{% endif %}> 라이브 결제 사용 (해제 시 테스트)</label></div><div class="field"><label>정산 은행</label><input name="settlement_bank" value="{{ setting.settlement_bank }}" placeholder="예: 경남은행"></div><div class="field"><label>정산 계좌번호</label><input name="settlement_account" value="{{ setting.settlement_account }}" placeholder="토스페이먼츠 계약 정산계좌"></div><div class="field"><label>예금주</label><input name="settlement_holder" value="{{ setting.settlement_holder }}"></div><div class="field"><label>정산주기</label><input name="settlement_cycle" value="{{ setting.settlement_cycle }}" placeholder="예: D+5"></div><div class="field"><label>적용 수수료율(%)</label><input type="number" step="0.01" min="0" name="card_fee_rate" value="{{ setting.card_fee_rate }}" placeholder="토스 계약 수수료율"></div></div><button class="btn" type="submit" style="margin-top:18px">설정 저장</button></form>{% endblock %}
