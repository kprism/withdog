{% extends 'dashboard/base.html' %}{% block title %}회원 정보{% endblock %}{% block header %}회원 정보 관리{% endblock %}{% block content %}<div class="hero"><div><div class="eyebrow">MEMBER EDITOR</div><h2>{% if user %}회원 수정{% else %}회원 등록{% endif %}</h2><div class="muted">홈페이지 회원가입 양식과 동일한 개인정보 항목입니다.</div></div></div><form class="panel" method="post">{% csrf_token %}<div class="form-grid"><div class="field"><label>이름 *</label><input name="name" required value="{{ profile.name|default:'' }}"></div><div class="field"><label>생년월일</label><input type="date" name="birth_date" value="{% if profile.birth_date %}{{ profile.birth_date|date:'Y-m-d' }}{% endif %}"></div><div class="field"><label>성별</label><select name="gender"><option value="">선택</option><option value="M" {% if profile.gender == 'M' %}selected{% endif %}>남성</option><option value="F" {% if profile.gender == 'F' %}selected{% endif %}>여성</option><option value="O" {% if profile.gender == 'O' %}selected{% endif %}>기타</option></select></div><div class="field"><label>전화번호</label><input name="phone" value="{{ profile.phone|default:'' }}"></div><div class="field"><label>이메일 (로그인 아이디) *</label><input type="email" name="email" required value="{{ user.email|default:'' }}"></div><div class="field"><label>비밀번호 {% if user %}(변경할 때만 입력){% endif %}</label><input type="password" name="password"></div><div class="field"><label>지역</label><input name="region" value="{{ profile.region|default:'' }}" placeholder="예: 창원시"></div><div class="field"><label>상세주소</label><input name="address_detail" value="{{ profile.address_detail|default:'' }}"></div><div class="field"><label>회원 구분</label><select name="membership_status"><option value="general" {% if profile.membership_status == 'general' %}selected{% endif %}>일반회원</option><option value="pending" {% if profile.membership_status == 'pending' %}selected{% endif %}>정회원 승인대기</option><option value="regular" {% if profile.membership_status == 'regular' %}selected{% endif %}>정회원</option><option value="withdrawn" {% if profile.membership_status == 'withdrawn' %}selected{% endif %}>탈퇴</option></select></div></div><div style="margin:20px 0;display:flex;gap:22px;flex-wrap:wrap"><label><input type="checkbox" name="privacy_agreed" {% if profile.privacy_agreed %}checked{% endif %}> 개인정보 수집·이용 동의</label><label><input type="checkbox" name="regular_member_requested" {% if profile.regular_member_requested %}checked{% endif %}> 정회원/연회비 신청</label><label><input type="checkbox" name="is_active" {% if not user or user.is_active %}checked{% endif %}> 로그인 활성</label></div><button class="btn">저장</button> <a class="btn ghost" href="{% url 'operator_dashboard:manage_section' 'members' %}">취소</a></form>{% endblock %}
