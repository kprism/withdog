{% extends 'dashboard/base.html' %}{% block title %}업체 관리{% endblock %}{% block header %}관련업체 관리{% endblock %}{% block content %}<div class="hero"><div><div class="eyebrow">PARTNER EDITOR</div><h2>{% if p %}업체 수정{% else %}업체 직접 등록{% endif %}</h2></div></div><form class="panel" method="post">{% csrf_token %}<div class="form-grid"><div class="field"><label>업체명 *</label><input name="name" required value="{{ p.name|default:'' }}"></div><div class="field"><label>업종 *</label><select name="category" required>{% for c in categories %}<option value="{{ c.id }}" {% if p.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div><div class="field"><label>지역</label><input name="city" value="{{ p.city|default:'' }}" placeholder="창원시"></div><div class="field"><label>전화번호</label><input name="phone" value="{{ p.phone|default:'' }}"></div><div class="field" style="grid-column:1/-1"><label>주소 *</label><input name="address" required value="{{ p.address|default:'' }}"></div><div class="field"><label>위도</label><input name="latitude" value="{{ p.latitude|default:'' }}"></div><div class="field"><label>경도</label><input name="longitude" value="{{ p.longitude|default:'' }}"></div></div><div style="margin:20px 0;display:flex;gap:22px"><label><input type="checkbox" name="is_affiliated" {% if p.is_affiliated %}checked{% endif %}> 제휴업체</label><label><input type="checkbox" name="is_active" {% if not p or p.is_active %}checked{% endif %}> 홈페이지 노출</label></div><button class="btn">저장</button> <a class="btn ghost" href="{% url 'operator_dashboard:partners' %}">취소</a></form>{% endblock %}
