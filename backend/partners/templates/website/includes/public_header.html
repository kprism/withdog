<header class="site-header public-common-header" id="top">
    <a class="brand" href="/">
        <span class="brand-dog">🐶</span>
        <span>
            <b>경상남도 반려견 협회</b>
            <small>Gyeongnam Pet Dog Association</small>
        </span>
    </a>

    <nav class="header-actions">
        <a href="/#privacy">개인정보처리방침</a>

        {% if request.user.is_authenticated %}
            <span class="public-user-name">
                {{ request.user.username }}
            </span>

            <a class="btn btn-outline" href="/dashboard/">
                마이페이지
            </a>

            <form
                method="post"
                action="/dashboard/logout/"
                class="public-logout-form"
            >
                {% csrf_token %}
                <button type="submit" class="btn btn-gold">
                    로그아웃
                </button>
            </form>
        {% else %}
            <a class="btn btn-outline" href="/dashboard/login/">
                로그인
            </a>

            <a class="btn btn-gold" href="/join.html">
                회원가입
            </a>
        {% endif %}
    </nav>

    <button class="mobile-menu" type="button">☰</button>
</header>
